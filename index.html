<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Rush</title><style>
:root{font-family:system-ui,'Segoe UI',Tahoma,Arial,sans-serif;color:#f3f8ff;background:#091729}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0,#164351,#091729 65%)}main{width:min(540px,100%);text-align:center}h1{font-size:clamp(34px,7vw,52px);margin:0 0 24px;letter-spacing:-2px}.panel{background:#11253a;border:1px solid #2a485c;border-radius:24px;padding:24px;box-shadow:0 25px 70px #0004}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left}.field label{display:block;font-size:13px;color:#b7c8d7;margin:0 0 7px;font-weight:650}select{width:100%;background:#0a1b2d;color:white;border:1px solid #35516a;border-radius:11px;padding:12px;font:600 15px inherit;font-family:inherit;outline:none}.wheel-wrap{height:255px;display:grid;place-items:center;position:relative}.wheel{height:180px;width:180px;display:grid;place-items:center;border-radius:50%;background:conic-gradient(#1e5364 0 45deg,#286c75 45deg 90deg,#1e5364 90deg 135deg,#286c75 135deg 180deg,#1e5364 180deg 225deg,#286c75 225deg 270deg,#1e5364 270deg 315deg,#286c75 315deg);border:8px solid #48bd9f;box-shadow:0 0 0 9px #143247,0 12px 40px #0005;position:relative}.wheel:after{content:'';position:absolute;top:-25px;left:calc(50% - 10px);border-left:10px solid transparent;border-right:10px solid transparent;border-top:19px solid #f6cb6b}.wheel.spin{animation:spin .6s linear infinite}.wheel.spin strong{animation:counter .6s linear infinite}.wheel strong{font-size:92px;line-height:1;text-shadow:0 2px 8px #0005}@keyframes spin{to{transform:rotate(360deg)}}@keyframes counter{to{transform:rotate(-360deg)}}.result{min-height:80px;display:grid;place-items:center;gap:8px}.result h2{font-size:23px;margin:0}.result p{font-size:17px;margin:0;color:#bcd0df}.tags{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:5px}.tags span{border:1px solid #3b6371;background:#183a4b;padding:8px 12px;border-radius:30px;font-weight:700;font-size:14px}button{display:block;width:100%;border:0;background:#65e3b8;color:#092b30;font-size:19px;font-weight:850;padding:16px;border-radius:14px;margin-top:22px;cursor:pointer}button:disabled{opacity:.7;cursor:wait}@media(max-width:420px){.panel{padding:17px}.controls{gap:9px}select{font-size:13px;padding:10px}.wheel-wrap{height:220px}.wheel{height:160px;width:160px}.wheel strong{font-size:80px}}@media(prefers-reduced-motion:reduce){.wheel.spin,.wheel.spin strong{animation-duration:1.5s}}
</style></head><body><main><h1>WORD RUSH</h1><div class="panel"><div class="controls"><div class="field"><label for="lang">Language</label><select id="lang"><option value="random">🎲 Random</option><option value="en">English</option><option value="ar">العربية</option></select></div><div class="field"><label for="letter">Letter</label><select id="letter"><option value="random">🎲 Random</option></select></div><div class="field"><label for="subject">Subject</label><select id="subject"><option value="random">🎲 Random</option><option value="names">Names</option><option value="animals">Animals</option><option value="locations">Locations</option><option value="professions">Professions</option></select></div><div class="field"><label for="position">Letter position</label><select id="position"><option value="random">🎲 Random</option><option value="start">Beginning</option><option value="within">Within word</option></select></div></div><div class="wheel-wrap"><div class="wheel" id="wheel"><strong id="big">?</strong></div></div><div class="result" aria-live="polite"><h2 id="title">Ready?</h2><div class="tags" id="tags"></div></div><button id="go">SPIN</button></div></main><script>
const alph={en:[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'],ar:[...'ابتثجحخدذرزسشصضطظعغفقكلمنهوي']};const $=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)];const subjects=['names','animals','locations','professions'];const trans={en:{names:'Names',animals:'Animals',locations:'Locations',professions:'Professions',start:'Beginning',within:'Within word'},ar:{names:'أسماء',animals:'حيوانات',locations:'أماكن',professions:'مهن',start:'أول الكلمة',within:'داخل الكلمة'}};
function letters(){let lang=$('lang').value;let chars=lang==='random'?[]:alph[lang];$('letter').innerHTML='<option value="random">🎲 Random</option>'+chars.map(c=>`<option value="${c}">${c}</option>`).join('');$('letter').disabled=lang==='random';} $('lang').addEventListener('change',letters);letters();
$('go').addEventListener('click',()=>{let b=$('go');if(b.disabled)return;b.disabled=true;b.textContent='SPINNING…';$('title').textContent='';$('tags').innerHTML='';$('wheel').classList.add('spin');const lang=$('lang').value==='random'?pick(['en','ar']):$('lang').value;const letter=$('letter').value==='random'?pick(alph[lang]):$('letter').value;const subject=$('subject').value==='random'?pick(subjects):$('subject').value;const position=$('position').value==='random'?pick(['start','within']):$('position').value;const tick=setInterval(()=>$('big').textContent=pick(alph[pick(['en','ar'])]),85);setTimeout(()=>{clearInterval(tick);$('wheel').classList.remove('spin');$('big').textContent=letter;$('title').textContent=lang==='en'?'Your challenge':'تحدّيك';$('tags').innerHTML=`<span>${lang==='en'?'English':'العربية'}</span><span>${trans[lang][subject]}</span><span>${trans[lang][position]}</span>`;b.disabled=false;b.textContent='SPIN AGAIN';},4500)});
</script></body></html>
